<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 30px 15px;
        }
        .container {
            max-width: 480px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }
        h1 { color: #174ea6; text-align: center; }
        label { display: block; margin-top: 15px; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #174ea6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            padding: 12px;
            background: #e5f4e8;
            text-align: center;
            font-size: 20px;
        }
        .error { color: #b00020; }
    </style>
</head>
<body>
<div class="container">
    <h1>Student Result Predictor</h1>

    <p><strong>Model Version: {{ version }}</strong></p>

    <form method="POST">
        <label>Study Hours (0-24)</label>
        <input type="number" name="study_hours"
               min="0" max="24" step="0.1" required>

        <label>Attendance Percentage (0-100)</label>
        <input type="number" name="attendance"
               min="0" max="100" step="0.1" required>

        <label>Internal Marks (0-100)</label>
        <input type="number" name="internal_marks"
               min="0" max="100" step="0.1" required>

        <button type="submit">Predict Result</button>
    </form>

    {% if prediction %}
        <div class="result">
            Predicted Result: <strong>{{ prediction }}</strong>
        </div>
    {% endif %}

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
</div>
</body>
</html>
